name: Validate example configuration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  config:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/validate_config.py
      - name: Check committed Terraform network example
        run: python scripts/check_network.py 1-infrastructure/network.tfvars.json.example
      - run: python -m unittest discover -s tests -v

  ansible:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible syntax checker
        run: python -m pip install -r 2-configuration/requirements-ci.txt
      - name: Validate playbook and role syntax without executing tasks
        working-directory: 2-configuration
        run: ansible-playbook -i inventory-ci.ini playbook.yml --syntax-check
